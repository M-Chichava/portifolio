<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06101a"/>
      <stop offset="100%" style="stop-color:#0a1828"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c2a4a"/>
      <stop offset="100%" style="stop-color:#0e4272"/>
    </linearGradient>
    <linearGradient id="btnG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0284c7"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0ea5e9" flood-opacity="0.2"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="700" cy="70"  r="160" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.07"/>
  <circle cx="700" cy="70"  r="110" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.09"/>
  <circle cx="80"  cy="410" r="120" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.07"/>
  <!-- Glow -->
  <ellipse cx="250" cy="250" rx="200" ry="180" fill="#0ea5e9" opacity="0.04" filter="url(#glow)"/>

  <!-- ── Browser window ── -->
  <rect x="28" y="44" width="448" height="398" rx="13" fill="#0d1e30" filter="url(#shadow)"/>

  <!-- Chrome bar -->
  <rect x="28" y="44"  width="448" height="30" rx="13" fill="#111f30"/>
  <rect x="28" y="58"  width="448" height="16"          fill="#111f30"/>
  <!-- Traffic lights -->
  <circle cx="52" cy="59" r="5" fill="#ff5f57"/>
  <circle cx="66" cy="59" r="5" fill="#febc2e"/>
  <circle cx="80" cy="59" r="5" fill="#28c840"/>
  <!-- URL bar -->
  <rect x="100" y="52" width="260" height="14" rx="7" fill="rgba(255,255,255,0.06)"/>
  <text x="230" y="62" text-anchor="middle" font-family="system-ui" font-size="7.5" fill="rgba(255,255,255,0.3)">https://everest.co.mz</text>

  <!-- ── Site navbar ── -->
  <rect x="28" y="74" width="448" height="36" fill="#0a1928"/>
  <rect x="44"  y="83" width="48" height="12" rx="3" fill="#0ea5e9" opacity="0.9"/>
  <text x="68"  y="92" text-anchor="middle" font-family="system-ui" font-size="7" fill="white" font-weight="700">EVEREST</text>
  <text x="138" y="92" font-family="system-ui" font-size="7.5" fill="rgba(255,255,255,0.5)">Products</text>
  <text x="178" y="92" font-family="system-ui" font-size="7.5" fill="rgba(255,255,255,0.5)">Services</text>
  <text x="216" y="92" font-family="system-ui" font-size="7.5" fill="rgba(255,255,255,0.5)">About</text>
  <!-- Cart icon area -->
  <rect x="420" y="81" width="44" height="16" rx="8" fill="#0ea5e9"/>
  <text x="442" y="92" text-anchor="middle" font-family="system-ui" font-size="7.5" fill="white" font-weight="700">Cart 3</text>

  <!-- ── Hero section ── -->
  <rect x="28" y="110" width="448" height="100" fill="url(#hero)"/>
  <text x="60" y="140" font-family="system-ui" font-size="14" fill="white" font-weight="900" letter-spacing="-0.5">Mozambique&apos;s #1</text>
  <text x="60" y="158" font-family="system-ui" font-size="14" fill="#0ea5e9" font-weight="900" letter-spacing="-0.5">Online Marketplace</text>
  <text x="60" y="173" font-family="system-ui" font-size="8" fill="rgba(255,255,255,0.55)">Shop products and services from trusted local sellers.</text>
  <rect x="60" y="183" width="70" height="18" rx="9" fill="url(#btnG)"/>
  <text x="95" y="195" text-anchor="middle" font-family="system-ui" font-size="8" fill="white" font-weight="700">Shop Now →</text>

  <!-- ── Category chips ── -->
  <rect x="28" y="210" width="448" height="26" fill="#0a1928"/>
  <rect x="44"  y="216" width="52" height="14" rx="7" fill="#0ea5e9" opacity="0.9"/>
  <text x="70"  y="226" text-anchor="middle" font-family="system-ui" font-size="7" fill="white">All Items</text>
  <rect x="102" y="216" width="52" height="14" rx="7" fill="rgba(255,255,255,0.06)"/>
  <text x="128" y="226" text-anchor="middle" font-family="system-ui" font-size="7" fill="rgba(255,255,255,0.5)">Electronics</text>
  <rect x="160" y="216" width="44" height="14" rx="7" fill="rgba(255,255,255,0.06)"/>
  <text x="182" y="226" text-anchor="middle" font-family="system-ui" font-size="7" fill="rgba(255,255,255,0.5)">Fashion</text>
  <rect x="210" y="216" width="40" height="14" rx="7" fill="rgba(255,255,255,0.06)"/>
  <text x="230" y="226" text-anchor="middle" font-family="system-ui" font-size="7" fill="rgba(255,255,255,0.5)">Home</text>

  <!-- ── Product cards row ── -->
  <!-- Card 1 -->
  <rect x="36"  y="244" width="132" height="158" rx="10" fill="#0e2236" stroke="rgba(14,165,233,0.15)" stroke-width="1"/>
  <rect x="36"  y="244" width="132" height="76"  rx="10" fill="#133147"/>
  <rect x="36"  y="294" width="132" height="26"  fill="#133147"/>
  <text x="102" y="278" text-anchor="middle" font-family="system-ui" font-size="22" fill="rgba(255,255,255,0.3)">📱</text>
  <text x="52"  y="336" font-family="system-ui" font-size="8"  fill="white"              font-weight="700">Samsung Galaxy</text>
  <text x="52"  y="349" font-family="system-ui" font-size="7.5" fill="rgba(255,255,255,0.45)">Electronics</text>
  <text x="52"  y="364" font-family="system-ui" font-size="9"  fill="#0ea5e9"           font-weight="800">MT 45,000</text>
  <rect x="120" y="356" width="36" height="14" rx="7" fill="#0ea5e9"/>
  <text x="138" y="366" text-anchor="middle" font-family="system-ui" font-size="7" fill="white" font-weight="700">Add</text>
  <rect x="52"  y="390" width="100" height="6" rx="3" fill="rgba(14,165,233,0.15)"/>
  <rect x="52"  y="390" width="80"  height="6" rx="3" fill="rgba(14,165,233,0.5)"/>

  <!-- Card 2 -->
  <rect x="176" y="244" width="132" height="158" rx="10" fill="#0e2236" stroke="rgba(14,165,233,0.15)" stroke-width="1"/>
  <rect x="176" y="244" width="132" height="76"  rx="10" fill="#133147"/>
  <rect x="176" y="294" width="132" height="26"  fill="#133147"/>
  <text x="242" y="278" text-anchor="middle" font-family="system-ui" font-size="22" fill="rgba(255,255,255,0.3)">👟</text>
  <text x="192" y="336" font-family="system-ui" font-size="8"  fill="white"              font-weight="700">Nike Air Max</text>
  <text x="192" y="349" font-family="system-ui" font-size="7.5" fill="rgba(255,255,255,0.45)">Fashion</text>
  <text x="192" y="364" font-family="system-ui" font-size="9"  fill="#0ea5e9"           font-weight="800">MT 8,500</text>
  <rect x="260" y="356" width="36" height="14" rx="7" fill="#0ea5e9"/>
  <text x="278" y="366" text-anchor="middle" font-family="system-ui" font-size="7" fill="white" font-weight="700">Add</text>
  <rect x="192" y="390" width="100" height="6" rx="3" fill="rgba(14,165,233,0.15)"/>
  <rect x="192" y="390" width="60"  height="6" rx="3" fill="rgba(14,165,233,0.5)"/>

  <!-- Card 3 -->
  <rect x="316" y="244" width="132" height="158" rx="10" fill="#0e2236" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
  <rect x="316" y="244" width="132" height="76"  rx="10" fill="#133147"/>
  <rect x="316" y="294" width="132" height="26"  fill="#133147"/>
  <text x="382" y="278" text-anchor="middle" font-family="system-ui" font-size="22" fill="rgba(255,255,255,0.3)">💻</text>
  <text x="332" y="336" font-family="system-ui" font-size="8"  fill="white"              font-weight="700">MacBook Pro</text>
  <text x="332" y="349" font-family="system-ui" font-size="7.5" fill="rgba(255,255,255,0.45)">Electronics</text>
  <text x="332" y="364" font-family="system-ui" font-size="9"  fill="#0ea5e9"           font-weight="800">MT 120,000</text>
  <rect x="400" y="356" width="36" height="14" rx="7" fill="#0ea5e9"/>
  <text x="418" y="366" text-anchor="middle" font-family="system-ui" font-size="7" fill="white" font-weight="700">Add</text>
  <rect x="332" y="390" width="100" height="6" rx="3" fill="rgba(14,165,233,0.15)"/>
  <rect x="332" y="390" width="92"  height="6" rx="3" fill="rgba(14,165,233,0.5)"/>

  <!-- ── Right info panel ── -->
  <text x="512" y="108" font-family="system-ui" font-size="10" fill="rgba(14,165,233,0.8)" font-weight="700" letter-spacing="1">WEB PLATFORM</text>
  <text x="512" y="138" font-family="system-ui" font-size="26" fill="white" font-weight="900" letter-spacing="-0.8">Everest</text>
  <text x="512" y="164" font-family="system-ui" font-size="26" fill="#0ea5e9" font-weight="900" letter-spacing="-0.8">.co.mz</text>
  <text x="512" y="192" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="400">Mozambique&apos;s full-featured</text>
  <text x="512" y="206" font-family="system-ui" font-size="10" fill="rgba(255,255,255,0.5)" font-weight="400">e-commerce marketplace.</text>
  <!-- Divider -->
  <line x1="512" y1="222" x2="770" y2="222" stroke="rgba(14,165,233,0.15)" stroke-width="1"/>
  <!-- Stats -->
  <text x="512" y="250" font-family="system-ui" font-size="20" fill="white" font-weight="900">1K+</text>
  <text x="512" y="263" font-family="system-ui" font-size="8.5" fill="rgba(255,255,255,0.4)">Active Users</text>
  <text x="615" y="250" font-family="system-ui" font-size="20" fill="white" font-weight="900">500+</text>
  <text x="615" y="263" font-family="system-ui" font-size="8.5" fill="rgba(255,255,255,0.4)">Products</text>
  <!-- Tech tags -->
  <rect x="512" y="284" width="60" height="19" rx="9.5" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
  <text x="542" y="297" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#0ea5e9" font-weight="600">React</text>
  <rect x="580" y="284" width="74" height="19" rx="9.5" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
  <text x="617" y="297" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#0ea5e9" font-weight="600">TypeScript</text>
  <rect x="512" y="310" width="74" height="19" rx="9.5" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
  <text x="549" y="323" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#0ea5e9" font-weight="600">.NET Web API</text>
  <rect x="594" y="310" width="66" height="19" rx="9.5" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
  <text x="627" y="323" text-anchor="middle" font-family="system-ui" font-size="8.5" fill="#0ea5e9" font-weight="600">SQL Server</text>
  <!-- Live badge -->
  <rect x="512" y="356" width="80" height="22" rx="11" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.35)" stroke-width="1"/>
  <circle cx="526" cy="367" r="4" fill="#0ea5e9"/>
  <text x="545" y="371" font-family="system-ui" font-size="9" fill="#0ea5e9" font-weight="700">Live Site</text>
</svg>
